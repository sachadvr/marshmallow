name: marshmallow-prod
services:
  app:
    build: { context: ., target: prod }
    image: marshmallow:prod
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443", "${HTTPS_PORT:-443}:443/udp"]
    environment:
      SERVER_NAME: "${SERVER_NAME:?domaine (HTTPS automatique) ou :80 derrière un proxy TLS}"
      APP_SECRET: "${APP_SECRET:?générer avec: openssl rand -hex 32}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-}"
    volumes:
      - marshmallow_data:/data
      - caddy_config:/config
volumes:
  marshmallow_data:
  caddy_config:
